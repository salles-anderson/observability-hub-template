# Source of truth de alocação de CIDR. PR obrigatório p/ alterar.
# CI rejeita CIDR duplicado entre allocations (em qualquer bloco) ou CIDR que
# esteja em allocations e free ao mesmo tempo.
# Ao alocar: remova o CIDR de 'free', adicione em 'allocations' com account/env/status,
# e atualize o tfvars correspondente.
#
# status:
#   live     = VPC existe na AWS (conferido via describe-vpcs)
#   reserved = CIDR declarado em tfvars/variables de um stack, mas VPC ainda não existe
#   planned  = intenção registrada, sem código e sem VPC
#
# Última auditoria: 2026-08-17
#   Método: describe-vpcs em 12 contas (us-east-1, us-east-2, sa-east-1), cruzado com
#   os vpc_cidr dos stacks em terraform/ e com a route table do TGW tgw-00000000000000001.

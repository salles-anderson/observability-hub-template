conflicts:
  - cidr: "172.18.0.0/16"
    note: >-
      TRES donos na AWS, nao dois. Alem do ABC Card prod (vpc-00000000000000003, dono do CIDR
      no registry) existem: 333333333333 vpc-00000000000000022 (homolog antiga) e 777777777777
      vpc-00000000000000023 (akrk dev). Nenhuma das duas esta anexada ao TGW, e e esse CIDR
      compartilhado que impede a VPC 172.18 da conta homolog de entrar no Observability Hub.
      Resolucao: as contas legadas akrk (777777777777) e abc-card (666666666666) serao migradas
      para as contas novas, e nesse movimento os CIDRs 172.18 duplicados saem de cena. Para a
      VPC 172.18 da conta homolog, a decisao de 2026-08-26 foi outra: ela nao sera aposentada,
      as cargas continuam nela. Em vez disso ela ganhou um CIDR secundario, 172.30.0.0/16 (ver
      allocations acima), com subnets e route table proprias, e e por esse CIDR novo que ela
      entra no Observability Hub via TGW, sem colidir com o 172.18 do ABC Card prod.
      A CONFIRMAR (nao deduzir): conta de destino de cada migracao, card/plano de referencia e
      prazo. Reveja esta nota quando isso estiver definido.
  - cidr: "172.16.0.0/16"
    note: >-
      Duplicado nao documentado ate 2026-08-17: alem da akrk prod (dona no registry), existe
      666666666666 vpc-00000000000000024 "vpc-core-infra-prod-vpc" em sa-east-1. Nenhuma das
      duas colide no TGW hoje porque so a akrk prod esta anexada.
  - cidr: "172.17.0.0/16"
    note: >-
      Duplicado nao documentado ate 2026-08-17: alem da akrk homolog (dona no registry), existe
      666666666666 vpc-00000000000000025 "vpc-core-infra-homolog-vpc" em us-east-1. So a akrk
      homolog esta anexada ao TGW.
  - cidr: "172.31.0.0/16"
    note: >-
      O obs-hub usa 172.31.0.0/16 na VPC core, que e o mesmo range das aws-controltower-VPC e
      das DefaultVPC de praticamente todas as contas. Hoje nao quebra porque nenhuma control
      tower esta anexada ao TGW, mas qualquer attach futuro de VPC default colide.
  - cidr: "10.60.0.0/16"
    note: >-
      Tres VPCs no MESMO CIDR, mesma conta 999999999999 e mesma regiao sa-east-1:
      vpc-00000000000000026 (broker-akrk-staging), vpc-00000000000000027 (antecipey-staging)
      e vpc-00000000000000028 (seu-cash-staging). Nenhuma roteavel entre si.
  - cidr: "10.0.0.0/16"
    note: >-
      Range mais reusado do parque, sem dono unico possivel: 666666666666 (gestao-comissao-vpc,
      gestao-cartao-api-vpc, e uma VPC sem Name em us-east-2), 777777777777 (dois keycloak,
      vpc-serverless-nat, vpc-padrao us-east-2) e 141414141414 (projeto-vpc us-east-1 e us-east-2).
      Nao alocado no registry por nao ter dono unico. Nao usar para nada roteavel.
